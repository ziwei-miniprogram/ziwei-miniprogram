function splitColumns(list){const l=[],r=[];list.forEach((it,i)=>(i%2===0?l:r).push(it));return{l,r};}

/* ===== 渲染 ===== */
let calYear, calMonth, calToday;
function buildCalendar(year,month,today){
  const first=new Date(year,month-1,1);const sw=(first.getDay()+6)%7;const dim= new Date(year,month,0).getDate();const pd=new Date(year,month-1,0).getDate();const cells=[];
  for(let i=0;i<42;i++){let d,dm=false;if(i<sw){d=pd-sw+1+i;dm=true;}else if(i>=sw+dim){d=i-(sw+dim)+1;dm=true;}else{d=i-sw+1;}
    let lu='';if(!dm){const L=getLunar(year,month,d);lu=L.term||L.dayCn;}
    cells.push({d,dm,today:!dm&&d===today,lu});}
  return cells;
}
function weatherFor(date){const seed=date.getFullYear()*372+date.getMonth()*31+date.getDate();const pool=[{temp:'22°',cond:'晴夜',icon:'🌙'},{temp:'24°',cond:'多云',icon:'⛅'},{temp:'19°',cond:'小雨',icon:'🌧'},{temp:'26°',cond:'晴',icon:'☀'},{temp:'21°',cond:'微风',icon:'🍃'},{temp:'18°',cond:'阵雨',icon:'🌦'},{temp:'23°',cond:'阴',icon:'☁'}];return pool[seed%pool.length];}
function renderHero(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();calYear=y;calMonth=m;calToday=d;
  const L=getLunar(y,m,d);const wn=['日','一','二','三','四','五','六'];
  document.getElementById('solar').textContent=`${m}月${d}日 周${wn[now.getDay()]}`;
  document.getElementById('lunar').textContent=L.fullCn;
  document.getElementById('starTip').textContent=L.term?`✦ 今日节气 · ${L.term}`:'✦ 今日星象 · 心静则明';
  document.getElementById('calHead').textContent=`${y} 年 ${m} 月`;
  const w=weatherFor(now);document.getElementById('wIcon').textContent=w.icon;document.getElementById('wTemp').textContent=w.temp;document.getElementById('wCond').textContent=w.cond;
  renderCal();renderYiJi(y,m,d);
  const fl=splitColumns(feed);fillCol('left',fl.l);fillCol('right',fl.r);
  const fL=splitColumns(followingFeed);fillCol('fLeft',fL.l);fillCol('fRight',fL.r);
  document.getElementById('followBar').innerHTML=following.map(f=>`<div class="fb"><div class="fb-av">${f.avatar}</div><div class="fb-nm">${f.name}</div><div class="fb-tag">已关注</div></div>`).join('');
  document.getElementById('vfeed').innerHTML=videos.map(v=>`<div class="vcard"><div class="v-cover" style="background:${v.bg}"><span class="v-emoji">${v.cover}</span><div class="v-play">▶</div><div class="v-dur">${v.dur}</div><div class="v-topic">${v.topic}</div></div><div class="v-body"><div class="v-tt">${v.title}</div><div class="v-meta"><span class="v-auth">${v.author}</span><span class="v-plays">▶ ${v.plays}</span></div></div></div>`).join('');
}
function renderCal(){
  const cells=buildCalendar(calYear,calMonth,calToday);
  document.getElementById('calGrid').innerHTML=cells.map(c=>`<div class="mc-d ${c.dim?'dim':''} ${c.today?'today':''}" onclick="pickDay(${c.d},${c.dm})"><span>${c.d}</span><span class="mc-lu">${c.lu}</span></div>`).join('');
}
function renderYiJi(y,m,d){
  const L=getLunar(y,m,d);
  document.getElementById('yiji').innerHTML=`<div class="yj-head">${m}月${d}日 · ${L.fullCn} ${L.term?`<span class="yj-term">${L.term}</span>`:''} · ${L.jianChu}</div><div class="yj-row"><span class="yj-yi">宜</span>${L.yi}</div><div class="yj-row"><span class="yj-ji">忌</span>${L.ji}</div>`;
}
function pickDay(d,dm){if(dm)return;renderYiJi(calYear,calMonth,d);}
function switchTab(i){
  document.querySelectorAll('.t').forEach(t=>t.classList.toggle('on',+t.dataset.i===i));
  document.getElementById('pFollow').classList.toggle('hidden',i!==0);
  document.getElementById('pFind').classList.toggle('hidden',i!==1);
  document.getElementById('pVideo').classList.toggle('hidden',i!==2);
}
function lightLamp(){const el=document.querySelector('.lamp');el.textContent='🪔 心灯已亮 · 今日已 +1 功德';}
function refreshWeather(){const w=document.querySelector('.weather');w.style.opacity=.6;setTimeout(()=>{w.style.opacity=1;},400);}
